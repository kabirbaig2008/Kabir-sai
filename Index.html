<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bg: '#f0f4f9',
                            darkBg: '#131314',
                            sidebar: '#e3e3e3',
                            sidebarDark: '#1e1f20',
                            userBubble: '#c2e7ff',
                            userBubbleDark: '#004a77',
                            aiBubble: '#ffffff',
                            aiBubbleDark: '#1e1f20'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base styles & Utility classes */
        :root {
            color-scheme: light dark;
        }
        
        body, html {
            height: 100dvh; /* Mobile-safe full height */
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f4f9;
        }
        
        html.dark body {
            background-color: #131314;
        }

        /* App visibility */
        #app-container { display: none; }
        body.loaded #loading { display: none; }
        body.loaded #app-container { display: flex; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Markdown Typography Styles */
        .markdown-body { font-size: 1rem; line-height: 1.6; word-break: break-word; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .markdown-body h1 { font-size: 1.5rem; }
        .markdown-body h2 { font-size: 1.25rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
        .markdown-body code { font-family: monospace; font-size: 0.9em; background: #e2e8f0; color: #0f172a; padding: 0.1rem 0.3rem; border-radius: 0.25rem; }
        .markdown-body pre code { background: transparent; color: inherit; padding: 0; }
        
        .dark .markdown-body code { background: #334155; color: #f1f5f9; }
        .dark .markdown-body pre { background: #000000; }
        .dark .markdown-body pre code { background: transparent; }

        /* Sidebar transitions */
        #sidebar { transition: transform 0.3s ease; }
        
        /* Blinking Cursor for streaming */
        .typing-cursor::after {
            content: '▋';
            animation: blink 1s step-start infinite;
            margin-left: 2px;
            color: #3b82f6;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <!-- Loading Fallback -->
    <div id="loading" class="flex h-[100dvh] w-full items-center justify-center bg-gemini-bg dark:bg-gemini-darkBg text-gray-800 dark:text-gray-200">
        <div class="flex flex-col items-center gap-4">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i>
            <span class="text-lg font-medium">Loading App...</span>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="h-[100dvh] w-full flex bg-gemini-bg dark:bg-gemini-darkBg text-gray-900 dark:text-gray-100 relative">
        
        <!-- Mobile Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="absolute md:relative z-50 w-72 h-full bg-gemini-sidebar dark:bg-gemini-sidebarDark flex flex-col transform -translate-x-full md:translate-x-0 shrink-0 shadow-xl md:shadow-none">
            
            <div class="p-4 flex items-center justify-between">
                <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-full hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <button onclick="createNewChat()" class="flex-1 ml-2 bg-white dark:bg-[#282a2c] hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-full py-2 px-4 flex items-center justify-center gap-2 transition-colors">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>
            </div>

            <!-- Chat List -->
            <div class="flex-1 overflow-y-auto p-3" id="chat-list">
                <!-- Dynamically populated -->
            </div>

            <!-- Bottom Sidebar Area -->
            <div class="p-4 border-t border-gray-300 dark:border-gray-700 flex flex-col gap-2">
                <button onclick="toggleTheme()" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors w-full text-left">
                    <i id="theme-icon" class="fa-solid fa-moon w-5 text-center"></i>
                    <span id="theme-text">Dark Mode</span>
                </button>
                <button onclick="openSettings()" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors w-full text-left">
                    <i class="fa-solid fa-gear w-5 text-center"></i>
                    <span>Settings</span>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col h-[100dvh] w-full min-w-0 relative">
            
            <!-- Header -->
            <header class="h-16 flex items-center px-4 bg-gemini-bg dark:bg-gemini-darkBg shrink-0 justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 md:hidden transition-colors">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-semibold truncate" id="current-chat-title">Universal AI</h1>
                </div>
                <div class="text-sm px-3 py-1 rounded-full bg-gray-200 dark:bg-gray-800 hidden sm:block truncate max-w-[200px]" id="header-model-name">
                    Loading...
                </div>
            </header>

            <!-- Messages Container -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:px-[10%] lg:px-[15%] pb-32">
                <!-- Dynamically populated -->
            </div>

            <!-- Input Area (Sticky Bottom) -->
            <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-gemini-bg via-gemini-bg dark:from-gemini-darkBg dark:via-gemini-darkBg to-transparent pb-4 pt-10 px-4 md:px-[10%] lg:px-[15%]">
                <form id="chat-form" class="relative flex items-end gap-2 bg-white dark:bg-[#1e1f20] p-2 rounded-3xl shadow-[0_0_15px_rgba(0,0,0,0.05)] dark:shadow-[0_0_15px_rgba(0,0,0,0.2)] border border-gray-200 dark:border-gray-700 max-h-40">
                    <textarea 
                        id="message-input" 
                        class="w-full bg-transparent resize-none outline-none py-3 px-4 max-h-32 text-gray-900 dark:text-white placeholder-gray-500"
                        rows="1" 
                        placeholder="Type your message here..."
                        oninput="autoResize(this)"
                        onkeydown="handleEnter(event)"
                    ></textarea>
                    <button type="submit" id="send-button" class="p-3 m-1 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 hover:text-blue-500 dark:hover:text-blue-400 transition-colors h-[44px] w-[44px] flex items-center justify-center shrink-0 disabled:opacity-50">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
                <div class="text-center text-xs text-gray-500 mt-2">
                    AI can make mistakes. Check important info.
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-[100] hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 rounded-2xl w-full max-w-md shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center shrink-0">
                <h2 class="text-xl font-bold">Settings</h2>
                <button onclick="closeSettings()" class="text-gray-500 hover:text-gray-800 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 flex-1 overflow-y-auto flex flex-col gap-5">
                <div>
                    <label class="block text-sm font-medium mb-1">OpenRouter API Key *</label>
                    <input type="password" id="setting-api-key" class="w-full p-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-blue-500" placeholder="sk-or-v1-...">
                    <p class="text-xs text-gray-500 mt-1">Stored locally in your browser.</p>
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-1">Model Name</label>
                    <input type="text" id="setting-model" class="w-full p-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-blue-500" placeholder="deepseek/deepseek-r1:free">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">System Prompt (Global)</label>
                    <textarea id="setting-system-prompt" rows="3" class="w-full p-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-blue-500 resize-none" placeholder="You are a helpful AI assistant."></textarea>
                </div>
            </div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-800 flex justify-end gap-3 shrink-0">
                <button onclick="closeSettings()" class="px-5 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">Cancel</button>
                <button onclick="saveSettings()" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition-colors">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIC (AT THE VERY END OF BODY) -->
    <script>
        // --- State Management ---
        const DEFAULT_MODEL = 'deepseek/deepseek-r1:free';
        let state = {
            chats: [],
            currentChatId: null,
            settings: {
                apiKey: '',
                model: DEFAULT_MODEL,
                systemPrompt: 'You are a helpful, respectful, and honest assistant.',
                darkMode: false
            }
        };

        let isGenerating = false;
        let abortController = null;

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            applyTheme(state.settings.darkMode);
            
            if (state.chats.length === 0) {
                createNewChat();
            } else {
                if (!state.currentChatId || !state.chats.find(c => c.id === state.currentChatId)) {
                    state.currentChatId = state.chats[0].id;
                }
                renderChatList();
                renderCurrentChat();
            }

            document.getElementById('header-model-name').textContent = state.settings.model || DEFAULT_MODEL;

            // Remove loading screen
            document.body.classList.add('loaded');
            
            // Focus input on desktop
            if(window.innerWidth > 768) {
                document.getElementById('message-input').focus();
            }

            // Setup marked options for security & styling
            marked.setOptions({
                breaks: true,
                gfm: true
            });
        });

        // --- Data Persistence ---
        function loadState() {
            try {
                const saved = localStorage.getItem('universalAiState');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.chats = parsed.chats || [];
                    state.currentChatId = parsed.currentChatId;
                    state.settings = { ...state.settings, ...parsed.settings };
                }
            } catch (e) {
                console.error("Failed to load state", e);
            }
            
            // Check system preference if dark mode isn't explicitly set
            if (localStorage.getItem('universalAiState') === null) {
                state.settings.darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
        }

        function saveState() {
            try {
                localStorage.setItem('universalAiState', JSON.stringify(state));
            } catch (e) {
                console.error("Failed to save state", e);
            }
        }

        // --- Theme Management ---
        function applyTheme(isDark) {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            
            if (isDark) {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun w-5 text-center';
                text.textContent = 'Light Mode';
            } else {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-moon w-5 text-center';
                text.textContent = 'Dark Mode';
            }
            state.settings.darkMode = isDark;
            saveState();
        }

        function toggleTheme() {
            applyTheme(!state.settings.darkMode);
        }

        // --- UI Interactions ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 128 ? textarea.scrollHeight : 128) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('chat-form').dispatchEvent(new Event('submit'));
            }
        }

        // --- Settings Management ---
        function openSettings() {
            document.getElementById('setting-api-key').value = state.settings.apiKey;
            document.getElementById('setting-model').value = state.settings.model || DEFAULT_MODEL;
            document.getElementById('setting-system-prompt').value = state.settings.systemPrompt;
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
            
            // Close sidebar on mobile if open
            if(window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('mobile-overlay').classList.add('hidden');
            }
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
        }

        function saveSettings() {
            state.settings.apiKey = document.getElementById('setting-api-key').value.trim();
            state.settings.model = document.getElementById('setting-model').value.trim() || DEFAULT_MODEL;
            state.settings.systemPrompt = document.getElementById('setting-system-prompt').value.trim();
            saveState();
            document.getElementById('header-model-name').textContent = state.settings.model;
            closeSettings();
        }

        // --- Chat Management ---
        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                title: 'New Chat',
                messages: []
            };
            state.chats.unshift(newChat);
            state.currentChatId = newChat.id;
            saveState();
            renderChatList();
            renderCurrentChat();
            
            if(window.innerWidth < 768) toggleSidebar();
            
            const input = document.getElementById('message-input');
            input.value = '';
            autoResize(input);
            input.focus();
        }

        function switchChat(id) {
            if(isGenerating) return;
            state.currentChatId = id;
            saveState();
            renderChatList();
            renderCurrentChat();
            if(window.innerWidth < 768) toggleSidebar();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            if(!confirm("Are you sure you want to delete this chat?")) return;
            
            state.chats = state.chats.filter(c => c.id !== id);
            if (state.currentChatId === id) {
                state.currentChatId = state.chats.length > 0 ? state.chats[0].id : null;
                if(!state.currentChatId) createNewChat();
                else renderCurrentChat();
            }
            saveState();
            renderChatList();
        }

        function renameChat(id, event) {
            event.stopPropagation();
            const chat = state.chats.find(c => c.id === id);
            if(!chat) return;
            
            const newTitle = prompt("Enter new name for chat:", chat.title);
            if(newTitle && newTitle.trim()) {
                chat.title = newTitle.trim();
                saveState();
                renderChatList();
                if(state.currentChatId === id) {
                    document.getElementById('current-chat-title').textContent = chat.title;
                }
            }
        }

        // --- Rendering ---
        function renderChatList() {
            const container = document.getElementById('chat-list');
            con
